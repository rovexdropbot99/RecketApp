<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>rovex_drop - Rocket</title>


<style>

/* ================= BASIC ================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 15%,
            #293b78,
            #0b1020 45%,
            #05070d
        );
}


/* ================= HEADER ================= */

header {

    height: 70px;

    padding: 0 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: rgba(10,15,31,.95);

    border-bottom:
        1px solid #ffffff12;
}

.back {

    color: white;

    text-decoration: none;

    background: #1b2544;

    padding: 10px 15px;

    border-radius: 12px;
}

.logo {

    color: #8491ff;

    font-size: 21px;

    font-weight: bold;
}

.balance {

    background: #151e38;

    padding: 10px 14px;

    border-radius: 12px;

    color: #b7c0ff;

    font-weight: bold;
}


/* ================= CONTAINER ================= */

.container {

    width: 92%;

    max-width: 700px;

    margin: auto;

    padding: 30px 0;

    text-align: center;
}

h1 {

    font-size: 34px;

    margin-bottom: 7px;
}

.subtitle {

    color: #8f99b2;

    margin-bottom: 22px;
}


/* ================= GAME ================= */

.game {

    position: relative;

    height: 330px;

    overflow: hidden;

    border-radius: 25px;

    background:
        linear-gradient(
            #111b3b,
            #080d1b
        );

    border:
        1px solid #ffffff12;

    box-shadow:
        0 20px 60px #00000055;
}


.stars {

    position: absolute;

    inset: 0;

    background-image:
        radial-gradient(
            circle,
            white 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .22;
}


.round {

    position: absolute;

    top: 16px;

    left: 18px;

    color: #8f99b2;

    font-size: 14px;

    z-index: 5;
}


.phase {

    position: absolute;

    top: 16px;

    right: 18px;

    color: #8f99b2;

    font-size: 14px;

    z-index: 5;
}


.multiplier {

    position: absolute;

    top: 48px;

    left: 0;

    right: 0;

    z-index: 5;

    font-size: 48px;

    font-weight: bold;

    color: #8795ff;

    text-shadow:
        0 0 25px #6878ff55;
}


.rocket {

    position: absolute;

    left: 50%;

    bottom: 35px;

    transform:
        translateX(-50%);

    font-size: 78px;

    z-index: 3;

    transition:
        bottom .1s linear;
}


.explosion {

    position: absolute;

    left: 50%;

    bottom: 100px;

    transform:
        translateX(-50%)
        scale(0);

    font-size: 90px;

    z-index: 10;

    opacity: 0;
}


.explosion.show {

    animation:
        explode .7s ease-out;
}


@keyframes explode {

    0% {

        transform:
            translateX(-50%)
            scale(0);

        opacity: 0;
    }

    40% {

        transform:
            translateX(-50%)
            scale(1.3);

        opacity: 1;
    }

    100% {

        transform:
            translateX(-50%)
            scale(1.7);

        opacity: 0;
    }
}


.status {

    position: absolute;

    bottom: 15px;

    left: 0;

    right: 0;

    color: #8d97af;

    z-index: 5;

    font-size: 13px;
}


/* ================= CONTROLS ================= */

.controls {

    margin-top: 18px;

    padding: 20px;

    background: #11182c;

    border:
        1px solid #ffffff10;

    border-radius: 20px;
}


.amount-title {

    color: #9da7bf;

    margin-bottom: 10px;
}


/* ================= CUSTOM AMOUNT ================= */

.custom-box {

    display: flex;

    gap: 8px;

    margin-bottom: 12px;
}


.custom-input {

    flex: 1;

    min-width: 0;

    padding: 13px;

    border:
        1px solid #303a5c;

    border-radius: 12px;

    background: #0d1428;

    color: white;

    font-size: 16px;

    outline: none;
}


.custom-input:focus {

    border-color: #6878ff;
}


.set-button {

    padding: 13px 18px;

    border: none;

    border-radius: 12px;

    background: #263452;

    color: white;

    cursor: pointer;

    font-weight: bold;
}


/* ================= QUICK AMOUNTS ================= */

.amounts {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 8px;

    margin-bottom: 15px;
}


.amount {

    padding: 12px 5px;

    border:
        1px solid #303a5c;

    border-radius: 12px;

    background: #18213a;

    color: white;

    cursor: pointer;
}


.amount.active {

    background: #6878ff;

    border-color: #6878ff;
}


.amount:disabled,
.set-button:disabled {

    opacity: .45;

    cursor: not-allowed;
}


/* ================= LIVE WIN ================= */

.selected {

    margin-bottom: 15px;

    padding: 13px;

    border-radius: 14px;

    background: #0d1428;

    border:
        1px solid #ffffff0d;

    color: #b6bfff;

    font-weight: bold;
}


.arrow {

    margin:
        0 8px;

    color: #6878ff;
}


#potentialWin {

    color: #8dffbd;

    font-size: 19px;

}


/* ================= BUTTONS ================= */

.buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}


.bet,
.claim {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 14px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #6075ff,
            #955cff
        );

    box-shadow:
        0 8px 25px
        rgba(96,117,255,.25);

    transition: .2s;
}


.bet:hover,
.claim:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 30px
        rgba(96,117,255,.4);
}


.bet:active,
.claim:active {

    transform:
        scale(.97);
}


.bet:disabled,
.claim:disabled {

    opacity: .4;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}


/* ================= RESULT ================= */

.result {

    min-height: 24px;

    margin-top: 15px;

    color: #aeb8cf;
}


/* ================= HISTORY ================= */

.history {

    margin-top: 18px;

    padding: 18px;

    border-radius: 20px;

    background: #11182c;

    text-align: left;
}


.history h2 {

    font-size: 18px;

    margin-bottom: 10px;
}


#historyList {

    color: #8993aa;

    line-height: 1.8;

    font-size: 14px;
}


/* ================= MOBILE ================= */

@media(max-width:600px) {

    h1 {

        font-size: 29px;
    }

    .game {

        height: 290px;
    }

    .multiplier {

        font-size: 40px;
    }

    .rocket {

        font-size: 68px;
    }

    .amounts {

        grid-template-columns:
            repeat(2,1fr);
    }

    .buttons {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

<a
href="index.html"
class="back">

← Back

</a>


<div class="logo">

rovex_drop

</div>


<div class="balance">

⭐
<span id="balance">
1000
</span>

</div>

</header>



<div class="container">


<h1>

🚀 Rocket Drop

</h1>


<p class="subtitle">

Virtual Demo Points

</p>



<!-- ================= ROCKET GAME ================= -->

<div class="game">


<div class="stars"></div>


<div class="round">

Round
<span id="roundNumber">
1
</span>

</div>


<div
class="phase"
id="phase">

BET 5

</div>


<div
class="multiplier"
id="multiplier">

1.00x

</div>


<div
class="rocket"
id="rocket">

🚀

</div>


<div
class="explosion"
id="explosion">

💥

</div>


<div
class="status"
id="status">

Place your Demo Points

</div>


</div>



<!-- ================= CONTROLS ================= -->

<div class="controls">


<div class="amount-title">

⭐ Demo Points Amount

</div>



<!-- CUSTOM AMOUNT -->

<div class="custom-box">


<input
id="customAmount"
class="custom-input"
type="number"
min="1"
placeholder="Enter amount">


<button
id="setButton"
class="set-button"
onclick="setCustomAmount()">

SET

</button>


</div>



<!-- QUICK AMOUNTS -->

<div class="amounts">


<button
class="amount active"
onclick="selectAmount(10,this)">

⭐ 10

</button>


<button
class="amount"
onclick="selectAmount(50,this)">

⭐ 50

</button>


<button
class="amount"
onclick="selectAmount(100,this)">

⭐ 100

</button>


<button
class="amount"
onclick="selectAmount(250,this)">

⭐ 250

</button>


</div>



<!-- LIVE BET / WIN -->

<div class="selected">

BET:
⭐<span id="betAmount">
10
</span>


<span class="arrow">
→
</span>


WIN:
⭐<span id="potentialWin">
10
</span>

</div>



<!-- BET + CLAIM -->

<div class="buttons">


<button
id="betButton"
class="bet"
onclick="placeBet()">

⭐ BET

</button>


<button
id="claimButton"
class="claim"
onclick="claimReward()"
disabled>

🎁 CLAIM

</button>


</div>


<div
class="result"
id="result">

</div>


</div>



<!-- ================= HISTORY ================= -->

<div class="history">


<h2>

📜 Round History

</h2>


<div id="historyList">

Waiting for rounds...

</div>


</div>


</div>



<script>


/* ================= VARIABLES ================= */


let balance = 1000;


let selectedAmount = 10;


let lockedAmount = 0;


let roundNumber = 1;


let multiplier = 1;


let crashPoint = 0;


let rocketBottom = 35;


let countdown = 5;


let countdownTimer;


let rocketTimer;


let roundRunning = false;


let betLocked = false;


let claimed = false;



/* ================= ELEMENTS ================= */


const balanceText =
document.getElementById(
    "balance"
);


const betAmountText =
document.getElementById(
    "betAmount"
);


const potentialWinText =
document.getElementById(
    "potentialWin"
);


const roundText =
document.getElementById(
    "roundNumber"
);


const phaseText =
document.getElementById(
    "phase"
);


const multiplierText =
document.getElementById(
    "multiplier"
);


const rocket =
document.getElementById(
    "rocket"
);


const explosion =
document.getElementById(
    "explosion"
);


const statusText =
document.getElementById(
    "status"
);


const resultText =
document.getElementById(
    "result"
);


const betButton =
document.getElementById(
    "betButton"
);


const claimButton =
document.getElementById(
    "claimButton"
);


const customInput =
document.getElementById(
    "customAmount"
);


const setButton =
document.getElementById(
    "setButton"
);


const historyList =
document.getElementById(
    "historyList"
);



/* ================= BALANCE ================= */

function updateBalance() {

    balanceText.innerText =
        balance;

}



/* ================= SELECT AMOUNT ================= */

function selectAmount(
    amount,
    button
) {

    if(betLocked) {
        return;
    }


    selectedAmount =
        amount;


    betAmountText.innerText =
        amount;


    potentialWinText.innerText =
        amount;


    customInput.value =
        "";


    document
    .querySelectorAll(".amount")
    .forEach(function(item) {

        item.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );

}



/* ================= CUSTOM AMOUNT ================= */

function setCustomAmount() {

    if(betLocked) {
        return;
    }


    let amount =
        Math.floor(
            Number(
                customInput.value
            )
        );


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        resultText.innerText =
            "Enter a valid amount.";

        return;
    }


    selectedAmount =
        amount;


    betAmountText.innerText =
        amount;


    potentialWinText.innerText =
        amount;


    document
    .querySelectorAll(".amount")
    .forEach(function(item) {

        item.classList.remove(
            "active"
        );

    });


    resultText.innerText =
        "⭐ Selected " +
        amount +
        " Demo Points";

}



/* ================= BET ================= */

function placeBet() {

    if(betLocked) {
        return;
    }


    if(
        selectedAmount >
        balance
    ) {

        resultText.innerText =
            "Not enough Demo Points.";

        return;
    }


    lockedAmount =
        selectedAmount;


    balance -=
        lockedAmount;


    updateBalance();


    betLocked =
        true;


    betButton.disabled =
        true;


    setButton.disabled =
        true;


    document
    .querySelectorAll(".amount")
    .forEach(function(item) {

        item.disabled =
            true;

    });


    /*
       Immediately show
       current possible reward
    */

    potentialWinText.innerText =
        lockedAmount;


    resultText.innerText =
        "⭐ BET " +
        lockedAmount +
        " Demo Points";


    statusText.innerText =
        "⭐ Demo Points locked";

}



/* ================= COUNTDOWN ================= */

function startCountdown() {

    countdown = 5;


    roundRunning =
        false;


    betLocked =
        false;


    claimed =
        false;


    lockedAmount =
        0;


    betButton.disabled =
        false;


    claimButton.disabled =
        true;


    setButton.disabled =
        false;


    document
    .querySelectorAll(".amount")
    .forEach(function(item) {

        item.disabled =
            false;

    });


    phaseText.innerText =
        "BET 5";


    statusText.innerText =
        "Place your Demo Points";


    resultText.innerText =
        "";


    /*
       Show selected amount
       before betting
    */

    potentialWinText.innerText =
        selectedAmount;


    countdownTimer =
        setInterval(function() {


            countdown--;


            if(
                countdown > 0
            ) {

                phaseText.innerText =
                    "BET " +
                    countdown;

            }


            if(
                countdown <= 0
            ) {

                clearInterval(
                    countdownTimer
                );


                startRound();

            }


        },1000);

}



/* ================= START ROUND ================= */

function startRound() {

    roundRunning =
        true;


    betLocked =
        true;


    betButton.disabled =
        true;


    setButton.disabled =
        true;


    document
    .querySelectorAll(".amount")
    .forEach(function(item) {

        item.disabled =
            true;

    });


    phaseText.innerText =
        "LOCKED";


    statusText.innerText =
        "🚀 Rocket flying";


    multiplier =
        1;


    rocketBottom =
        35;


    multiplierText.innerText =
        "1.00x";


    rocket.style.bottom =
        rocketBottom + "px";


    /*
       Random demo crash
    */

    crashPoint =
        1.5 +
        Math.random() * 4.5;


    /*
       CLAIM available
       only after a bet
    */

    if(
        lockedAmount > 0
    ) {

        claimButton.disabled =
            false;

    }


    /*
       ROCKET LOOP
    */

    rocketTimer =
        setInterval(function() {


            multiplier +=
                0.04;


            rocketBottom +=
                1.1;


            multiplierText.innerText =
                multiplier.toFixed(2)
                + "x";


            rocket.style.bottom =
                rocketBottom + "px";



            /*
               LIVE WIN AMOUNT

               Example:

               250 × 1.00 = 250
               250 × 2.00 = 500
               250 × 5.00 = 1250
            */

            if(
                lockedAmount > 0
            ) {

                let potentialReward =
                    Math.floor(
                        lockedAmount *
                        multiplier
                    );


                potentialWinText.innerText =
                    potentialReward;

            }



            /*
               CRASH
            */

            if(
                multiplier >=
                crashPoint
            ) {

                crashRocket();

            }


        },100);

}



/* ================= CLAIM ================= */

function claimReward() {

    if(
        !roundRunning ||
        claimed ||
        lockedAmount <= 0
    ) {

        return;
    }


    claimed =
        true;


    claimButton.disabled =
        true;


    /*
       FINAL REWARD

       BET × CURRENT MULTIPLIER

       100 × 2 = 200
       100 × 5 = 500
       250 × 2 = 500
       250 × 5 = 1250
    */

    let reward =
        Math.floor(
            lockedAmount *
            multiplier
        );


    balance +=
        reward;


    updateBalance();


    /*
       Keep the WIN amount
       visible after claim
    */

    potentialWinText.innerText =
        reward;


    resultText.innerText =
        "🎁 CLAIMED ⭐ " +
        reward +
        " at " +
        multiplier.toFixed(2) +
        "x";


    statusText.innerText =
        "🎁 Reward claimed";

}



/* ================= CRASH ================= */

function crashRocket() {

    clearInterval(
        rocketTimer
    );


    roundRunning =
        false;


    claimButton.disabled =
        true;


    multiplier =
        crashPoint;


    multiplierText.innerText =
        multiplier.toFixed(2)
        + "x";


    phaseText.innerText =
        "CRASH";


    statusText.innerText =
        "💥 ROCKET CRASHED";


    explosion.classList.remove(
        "show"
    );


    void explosion.offsetWidth;


    explosion.classList.add(
        "show"
    );


    addHistory(
        roundNumber,
        multiplier
    );


    /*
       If user didn't claim,
       bet is lost.
    */

    if(
        !claimed &&
        lockedAmount > 0
    ) {

        resultText.innerText =
            "💥 Round " +
            roundNumber +
            " crashed. " +
            "Demo Points lost.";

    }


    setTimeout(
        nextRound,
        1800
    );

}



/* ================= HISTORY ================= */

function addHistory(
    number,
    value
) {

    if(
        historyList.innerText ===
        "Waiting for rounds..."
    ) {

        historyList.innerHTML =
            "";

    }


    const row =
        document.createElement(
            "div"
        );


    row.innerText =
        "Round " +
        number +
        " — " +
        value.toFixed(2) +
        "x";


    historyList.prepend(
        row
    );

}



/* ================= NEXT ROUND ================= */

function nextRound() {

    roundNumber++;


    roundText.innerText =
        roundNumber;


    rocketBottom =
        35;


    rocket.style.bottom =
        rocketBottom + "px";


    multiplierText.innerText =
        "1.00x";


    phaseText.innerText =
        "WAITING";


    statusText.innerText =
        "Next round...";


    setTimeout(
        startCountdown,
        1000
    );

}



/* ================= START ================= */

updateBalance();


setTimeout(
    startCountdown,
    1000
);

</script>


</body>

</html>
