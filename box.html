<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#070b16;
    color:white;
}

header{
    background:#10182b;
    padding:15px 20px;
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    background:#26334d;
    color:white;
    border:0;
    padding:10px 15px;
    border-radius:10px;
}

.logo{
    color:#5ee7ff;
    font-size:21px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:#111a2d;
    border:1px solid #293957;
    border-radius:20px;
    padding:30px;
    text-align:center;
}

.box{
    font-size:110px;
    margin:25px;
}

button{
    border:0;
    padding:15px 30px;
    border-radius:12px;
    background:#ff9f1c;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.balance{
    color:#ffd84d;
    font-size:24px;
    margin-bottom:20px;
}

.result{
    margin-top:25px;
    background:#18243d;
    padding:20px;
    border-radius:15px;
    font-size:20px;
}
</style>
</head>

<body>

<header>

<button
class="back"
onclick="location.href='index.html'">
⬅ Back
</button>

<div class="logo">
📦 Box
</div>

</header>


<div class="container">

<div class="card">

<h1>📦 Rocket Box</h1>

<div class="box">
📦
</div>

<div class="balance">
💎 <span id="balance">0</span> TON
</div>

<button onclick="openBox()">
📦 Open Box — 2 TON
</button>

<div
id="result"
class="result">
Open a box to get a reward.
</div>

</div>

</div>


<script>

const STORAGE_KEY="rocket_account";

let account=
JSON.parse(localStorage.getItem(STORAGE_KEY));

if(!account){

account={
ton:0,
freeClaimed:false,
inventory:[]
};

save();

}


if(!account.inventory){

account.inventory=[];

save();

}


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(account)
);

}


function update(){

document.getElementById(
"balance"
).textContent=account.ton;

}


function openBox(){

if(account.ton<2){

document.getElementById(
"result"
).textContent=
"❌ You need 2 TON.";

return;

}


account.ton-=2;


const rewards=[
"🚀 Rocket",
"⚡ Thunder",
"🔥 Fire",
"💎 Diamond"
];


const reward=
rewards[
Math.floor(
Math.random()*rewards.length
)
];


account.inventory.push(reward);

save();

update();


document.getElementById(
"result"
).textContent=
"🎉 You got: "+reward;

}


update();

</script>

</body>
</html>
